<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayStation 5 - Welcome</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="welcome-body" onclick="bootConsole()">
    <div class="light-ray"></div>
    <div class="particle-field" id="particles"></div>
    
    <div class="welcome-content">
        <p class="ps-prompt">Press the PS button on your controller.</p>
        <div class="ps-button-ring">
            <div class="ps-logo">
                <img src="Images/ps5logo.png" alt="PS Logo" class="ps-icon-img">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
